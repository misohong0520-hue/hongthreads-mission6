server {
    listen 80;
    listen [::]:80;
    server_name hongthreads.hongsik.blog;
    client_max_body_size 100m;
    location ^~ /.well-known/acme-challenge/ { root /var/www/hongthreads-acme; }
    location ~ ^/(?:__shutdown|__desktop|__origin|__replay/(?:coverage|misses)|__workflow/resource|internal)(?:/|$) { return 404; }
    location /workspace/api/ {
        proxy_pass http://127.0.0.1:9251;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 185s;
    }
    location /workspace/ {
        # Retired workspace UI returns to the corresponding original DRT page.
        proxy_pass http://127.0.0.1:9251;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 185s;
    }
    location = /workspace { return 302 /dashboard/insights; }
    location / {
        proxy_pass http://127.0.0.1:9251;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 185s;
    }
}
