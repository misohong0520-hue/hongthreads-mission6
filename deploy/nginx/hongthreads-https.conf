server {
    listen 80;
    listen [::]:80;
    server_name hongthreads.hongsik.blog;
    location ^~ /.well-known/acme-challenge/ { root /var/www/hongthreads-acme; }
    location / { return 301 https://hongthreads.hongsik.blog$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hongthreads.hongsik.blog;
    ssl_certificate /etc/letsencrypt/live/hongthreads.hongsik.blog/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hongthreads.hongsik.blog/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ~ ^/(?:__shutdown|__desktop|__origin|__replay/(?:coverage|misses)|__workflow/resource|internal)(?:/|$) { return 404; }
    location = /workspace { return 302 /dashboard/insights; }
    location / {
        proxy_pass http://127.0.0.1:9251;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 185s;
    }
}
